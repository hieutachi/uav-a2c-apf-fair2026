<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Luồng kết thúc một episode" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6672"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect width="980" height="470" fill="#ffffff"/>
<text x="24" y="34" text-anchor="start" font-size="17" fill="#1b1f23" font-weight="600">Một transition của episode: từ lệnh điều khiển tới trạng thái kết thúc</text>
<text x="24" y="56" text-anchor="start" font-size="11.5" fill="#5b6672">Collision được xét TRƯỚC success; mỗi episode nhận đúng một nhãn.</text>
<rect x="24" y="92" width="150" height="62" rx="10" ry="10" fill="#eef4fb" stroke="#1565c0" stroke-width="1.3"/>
<text x="99.0" y="118.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">Bước t</text>
<text x="99.0" y="134.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">state sₜ = [p,v,g−p,w]</text>
<line x1="174" y1="123" x2="214" y2="123" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="216" y="92" width="176" height="62" rx="10" ry="10" fill="#ffffff" stroke="#8b95a1" stroke-width="1.3"/>
<text x="304.0" y="118.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">A2C policy</text>
<text x="304.0" y="134.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">aₜᴬ²ᶜ ∈ [−1,1]³</text>
<line x1="392" y1="123" x2="432" y2="123" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="434" y="92" width="176" height="62" rx="10" ry="10" fill="#ffffff" stroke="#8b95a1" stroke-width="1.3"/>
<text x="522.0" y="118.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">APF (chỉ H0/H2)</text>
<text x="522.0" y="134.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">aₜᴬᴾᶠ từ tâm AABB</text>
<line x1="610" y1="123" x2="650" y2="123" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="652" y="92" width="150" height="62" rx="10" ry="10" fill="#fff8ef" stroke="#ef6c00" stroke-width="1.3"/>
<text x="727.0" y="118.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">Blend λₜ</text>
<text x="727.0" y="134.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">uₜ (CT-14)</text>
<line x1="802" y1="123" x2="842" y2="123" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="844" y="92" width="112" height="62" rx="10" ry="10" fill="#f5f9f5" stroke="#2e7d32" stroke-width="1.3"/>
<text x="900.0" y="118.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">Dynamics</text>
<text x="900.0" y="134.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">CT-3…CT-7</text>
<line x1="900" y1="154" x2="900" y2="190" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="700" y="192" width="256" height="40" rx="10" ry="10" fill="#ffffff" stroke="#8b95a1" stroke-width="1.3"/>
<text x="828.0" y="216.0" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">pₜ₊₁ sau tích phân + clamp độ cao</text>
<line x1="700" y1="212" x2="640" y2="212" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="430" y="186" width="208" height="52" rx="10" ry="10" fill="#fff5f5" stroke="#c62828" stroke-width="1.3"/>
<text x="534.0" y="207.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">swept AABB pₜ → pₜ₊₁ ?</text>
<text x="534.0" y="223.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">va chạm vật cản?</text>
<line x1="534" y1="238" x2="534" y2="274" stroke="#c62828" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="534.0" y="250.0" text-anchor="middle" font-size="10.5" fill="#c62828">có</text>
<rect x="430" y="276" width="208" height="46" rx="10" ry="10" fill="#c62828" stroke="#c62828" stroke-width="1.3"/>
<text x="534.0" y="294.9" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">COLLISION</text>
<text x="534.0" y="310.8" text-anchor="middle" font-size="10.3" fill="#ffffff">reward −200, episode dừng</text>
<line x1="430" y1="212" x2="300" y2="212" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="365" y="203" text-anchor="middle" font-size="10.5" fill="#5b6672">không</text>
<rect x="120" y="186" width="178" height="52" rx="10" ry="10" fill="#f5f9f5" stroke="#2e7d32" stroke-width="1.3"/>
<text x="209.0" y="207.9" text-anchor="middle" font-size="11.5" fill="#1b1f23" font-weight="600">‖g − pₜ₊₁‖ &lt; 3 m ?</text>
<text x="209.0" y="223.8" text-anchor="middle" font-size="10.3" fill="#1b1f23">đã tới đích?</text>
<line x1="209" y1="238" x2="209" y2="274" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="209.0" y="250.0" text-anchor="middle" font-size="10.5" fill="#2e7d32">có</text>
<rect x="105" y="276" width="208" height="46" rx="10" ry="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.3"/>
<text x="209.0" y="294.9" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">SUCCESS</text>
<text x="209.0" y="310.8" text-anchor="middle" font-size="10.3" fill="#ffffff">thưởng Bₜ = max(80, 150(1−n/H))</text>
<line x1="120" y1="212" x2="60" y2="212" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="24" y="186" width="36" height="52" rx="10" ry="10" fill="#fff8ef" stroke="#ef6c00" stroke-width="1.3"/>
<text x="42.0" y="208.4" text-anchor="middle" font-size="10" fill="#1b1f23" font-weight="600">t = H ?</text>
<text x="42.0" y="222.2" text-anchor="middle" font-size="8.8" fill="#1b1f23">H = 1507</text>
<line x1="42" y1="238" x2="42" y2="350" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="58" y="300" text-anchor="middle" font-size="10.5" fill="#ef6c00">có</text>
<rect x="24" y="352" width="208" height="44" rx="10" ry="10" fill="#ef6c00" stroke="#ef6c00" stroke-width="1.3"/>
<text x="128.0" y="369.9" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">TIMEOUT</text>
<text x="128.0" y="385.8" text-anchor="middle" font-size="10.3" fill="#ffffff">không thưởng, không −200</text>
<line x1="209" y1="186" x2="209" y2="150" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="250" y="168" text-anchor="middle" font-size="10.5" fill="#5b6672">không → bước t+1</text>
<rect x="240" y="92" width="0" height="0" rx="10" ry="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/>
<text x="240.0" y="96.4" text-anchor="middle" font-size="12.5" fill="#1b1f23" font-weight="600"></text>
<rect x="300" y="352" width="656" height="92" rx="10" ry="10" fill="#f7f9fb" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="312" y="377.5" text-anchor="start" font-size="11.5" fill="#1b1f23" font-weight="600">Vì sao thứ tự này quan trọng:</text>
<text x="312" y="393.4" text-anchor="start" font-size="10.3" fill="#1b1f23">• Nếu UAV chạm vật cản đúng lúc vào trong 3 m → nhãn là COLLISION, không phải SUCCESS (collision có ưu tiên).</text>
<text x="312" y="409.8" text-anchor="start" font-size="10.3" fill="#1b1f23">• Tổng ba nhãn luôn bằng 1000 cho mỗi cấu hình: 1000+0+0 · 830+58+112 · 55+905+40 — gate test kiểm tra tự động.</text>
<text x="312" y="426.1" text-anchor="start" font-size="10.3" fill="#1b1f23">• Bán kính phồng UAV = 0 và phép thử slab trên cả đoạn giúp chống 'xuyên hầm' vật cản mỏng.</text>
</svg>