<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Hệ thống phân cấp thực nghiệm" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6672"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker></defs>
<rect width="980" height="560" fill="#ffffff"/>
<text x="24" y="34" text-anchor="start" font-size="17" fill="#1b1f23" font-weight="600">Cấu trúc lồng nhau của một cấu hình — và số học của mẫu</text>
<text x="24" y="56" text-anchor="start" font-size="11.5" fill="#5b6672">Mỗi tầng là một đơn vị lấy mẫu khác nhau; tầng (map × training run) là ĐƠN VỊ SUY LUẬN.</text>
<rect x="330" y="78" width="320" height="46" rx="10" ry="10" fill="#eef4fb" stroke="#1565c0" stroke-width="1.3"/>
<text x="490.0" y="96.5" text-anchor="middle" font-size="12.5" fill="#1b1f23" font-weight="600">Configuration</text>
<text x="490.0" y="113.8" text-anchor="middle" font-size="11.3" fill="#1b1f23">H0 hybrid · H1 chỉ A2C · H2 chỉ APF</text>
<line x1="490" y1="124" x2="490" y2="152" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="300" y="154" width="380" height="46" rx="10" ry="10" fill="#f5f9f5" stroke="#2e7d32" stroke-width="1.3"/>
<text x="490.0" y="172.5" text-anchor="middle" font-size="12.5" fill="#1b1f23" font-weight="600">Map — 4 layout 300 m (density 0.8)</text>
<text x="490.0" y="189.8" text-anchor="middle" font-size="11.3" fill="#1b1f23">random-01 · corridor-01 · barrier-01 · mixed-01</text>
<line x1="490" y1="200" x2="490" y2="228" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="280" y="230" width="420" height="52" rx="10" ry="10" fill="#fff8ef" stroke="#ef6c00" stroke-width="1.3"/>
<text x="490.0" y="251.5" text-anchor="middle" font-size="12.5" fill="#1b1f23" font-weight="600">Training run / model — 5 model độc lập mỗi map</text>
<text x="490.0" y="268.8" text-anchor="middle" font-size="11.3" fill="#1b1f23">seed 101 · 211 · 307 · 401 · 503   (5M bước mỗi model)</text>
<line x1="490" y1="282" x2="490" y2="310" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="262" y="312" width="456" height="52" rx="10" ry="10" fill="#fdf3f3" stroke="#c62828" stroke-width="1.3"/>
<text x="490.0" y="333.5" text-anchor="middle" font-size="12.5" fill="#1b1f23" font-weight="600">Evaluation seed slot — 50 slot mỗi unit</text>
<text x="490.0" y="350.8" text-anchor="middle" font-size="11.3" fill="#1b1f23">base {1009,1013,1019,1021,1031} × episode 0..9</text>
<line x1="490" y1="364" x2="490" y2="392" stroke="#5b6672" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="300" y="394" width="380" height="44" rx="10" ry="10" fill="#f7f7f9" stroke="#8b95a1" stroke-width="1.3"/>
<text x="490.0" y="411.5" text-anchor="middle" font-size="12.5" fill="#1b1f23" font-weight="600">Rollout — 1 episode tất định</text>
<text x="490.0" y="428.8" text-anchor="middle" font-size="11.3" fill="#1b1f23">success / collision / timeout</text>
<rect x="730" y="154" width="226" height="46" rx="10" ry="10" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="843.0" y="172.5" text-anchor="middle" font-size="12.5" fill="#5b6672" font-weight="600">× 4</text>
<text x="843.0" y="189.8" text-anchor="middle" font-size="11.3" fill="#5b6672">4 map</text>
<rect x="730" y="236" width="226" height="46" rx="10" ry="10" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="843.0" y="254.5" text-anchor="middle" font-size="12.5" fill="#5b6672" font-weight="600">× 5 = 20 unit</text>
<text x="843.0" y="271.8" text-anchor="middle" font-size="11.3" fill="#5b6672">đơn vị suy luận</text>
<rect x="730" y="318" width="226" height="46" rx="10" ry="10" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="843.0" y="336.5" text-anchor="middle" font-size="12.5" fill="#5b6672" font-weight="600">× 50 = 1000</text>
<text x="843.0" y="353.8" text-anchor="middle" font-size="11.3" fill="#5b6672">rollout / cấu hình</text>
<rect x="730" y="400" width="226" height="38" rx="10" ry="10" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="843.0" y="414.5" text-anchor="middle" font-size="12.5" fill="#5b6672" font-weight="600">3 × 1000 = 3000</text>
<text x="843.0" y="431.8" text-anchor="middle" font-size="11.3" fill="#5b6672">H4 tái dùng quỹ đạo H0</text>
<rect x="24" y="154" width="250" height="46" rx="10" ry="10" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="149.0" y="173.0" text-anchor="middle" font-size="11" fill="#1b1f23" font-weight="600">Mỗi map có map_sha256</text>
<text x="149.0" y="188.2" text-anchor="middle" font-size="9.8" fill="#1b1f23">H0 và H1 dùng chung map</text>
<rect x="24" y="236" width="250" height="46" rx="10" ry="10" fill="#fff5f5" stroke="#c62828" stroke-width="1.3"/>
<text x="149.0" y="255.0" text-anchor="middle" font-size="11" fill="#1b1f23" font-weight="600">H2: 5 nhãn seed chỉ là</text>
<text x="149.0" y="270.2" text-anchor="middle" font-size="9.8" fill="#1b1f23">bookkeeping — không học</text>
<rect x="24" y="318" width="250" height="46" rx="10" ry="10" fill="#fff5f5" stroke="#c62828" stroke-width="1.3"/>
<text x="149.0" y="337.0" text-anchor="middle" font-size="11" fill="#1b1f23" font-weight="600">50 slot → chỉ 32 seed thật</text>
<text x="149.0" y="352.2" text-anchor="middle" font-size="9.8" fill="#1b1f23">18 slot lặp y hệt</text>
<rect x="24" y="400" width="250" height="38" rx="10" ry="10" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.3"/>
<text x="149.0" y="415.0" text-anchor="middle" font-size="11" fill="#1b1f23" font-weight="600">Policy deterministic</text>
<text x="149.0" y="430.2" text-anchor="middle" font-size="9.8" fill="#1b1f23">→ rollout lặp lại giống hệt</text>
<rect x="24" y="470" width="932" height="66" rx="10" ry="10" fill="#eef4fb" stroke="#1565c0" stroke-width="1.3"/>
<text x="490.0" y="498.8" text-anchor="middle" font-size="11.8" fill="#1b1f23">Đọc sơ đồ này thế nào: ghép cặp H0–H1 được thực hiện ở TẦNG 3 (map × training run), không phải ở tầng rollout.</text>
<text x="490.0" y="515.1" text-anchor="middle" font-size="10.600000000000001" fill="#1b1f23">Vì vậy n của kiểm định Wilcoxon là 20 (18 với efficiency), còn 1000 rollout chỉ dùng để MÔ TẢ (Wilson CI).</text>
</svg>